rootProject.name = 'framework'
include(
        // Shared @MappedSuperclass only -- no domain, no other DAL.
        "persistence-common",
        "core",
        // One module per bounded context. Each publishes into its own package
        // (org.yuktisetu.<context>.*) so a service scans only what it owns.
        "institute-dal",
        "identity-dal",
        "profile-dal",
        "drive-dal",
        "notification-dal",
        // Transactional outbox + event contracts, shared by producers.
        "messaging-dal"
)
