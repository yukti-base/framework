apply from: "../dependencies.gradle"

dependencies {

    api "org.springframework.boot:spring-boot-starter-data-jpa:${rootProject.ext.springBootVersion}"

    implementation "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"

    annotationProcessor "org.projectlombok:lombok:${rootProject.ext.lombokVersion}"

    implementation "org.postgresql:postgresql:${rootProject.ext.postgresVersion}"

    // drive entities carry real FKs into all three: College/Department for
    // posting targets and offers, User for applications and offers, and
    // StudentProfile for the eligibility fact assembly.
    api project(':persistence-common')
    api project(':institute-dal')
    api project(':identity-dal')
    api project(':profile-dal')

    // Test-only. The pure rule classes in org.yuktisetu.drive.model are the
    // "business rules frozen" contract of the migration -- they are the one
    // thing that must behave identically before and after every refactor, so
    // they are the first thing to get a regression net.
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
    useJUnitPlatform()
}
